<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paratrooper" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Paratrooper</title>
    <!-- DISABLED splash (v0.1.24): on a standalone iOS cold open the ~2s of
         white happens BEFORE this document arrives from the server, so an
         in-page splash cannot cover it — it only showed for the last blink.
         Kept commented out in case a non-PWA shell ever exists, where the
         page is local and the wait really is the app booting.
    <style>
      html { background: #fff; }
      .splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 14px;
        font: 600 20px/1.2 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
        color: #000;
      }
      .splash img { width: 76px; height: 76px; border-radius: 18px; }
      .splash-dots { display: flex; gap: 5px; margin-top: 2px; }
      .splash-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #8e8e93;
        animation: splash-blink 1.2s infinite both;
      }
      .splash-dots span:nth-child(2) { animation-delay: 0.2s; }
      .splash-dots span:nth-child(3) { animation-delay: 0.4s; }
      @keyframes splash-blink { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
      @media (prefers-color-scheme: dark) {
        html { background: #000; }
        .splash { color: #fff; }
      }
    </style>
    -->
  </head>
  <body>
    <div id="app">
      <!-- splash markup, disabled with the styles above:
      <div class="splash">
        <img src="/icon-192.png" alt="" />
        <div>Paratrooper</div>
        <div class="splash-dots"><span></span><span></span><span></span></div>
      </div>
      -->
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
