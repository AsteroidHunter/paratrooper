    <!--
      THE LAUNCH COVER. It lives in this document rather than in the bundle,
      and src/splash.ts adopts the element below instead of building one.

      An in-page splash was tried once before and given up on (v0.1.24) with
      the note that on a standalone cold open the white happens BEFORE this
      document arrives, so nothing in the page could cover it. That was true
      then. It is not true now, because the app paints the phone's OWN launch
      image at runtime and installs it as apple-touch-startup-image (see the
      top of src/splash.ts), so the phone covers everything up to the moment
      the web view is handed this page. What is left is the stretch from that
      handover to the first thing the app draws, and that stretch has been
      measured on real cold opens rather than reasoned about: the document
      finished arriving at 109ms and 318ms, while the module bundle only began
      running at 338ms and 666ms. The cover went up 16ms after that. So the
      app's own startup was never the problem; fetching and parsing the bundle
      was, and the cover could not exist any earlier because the bundle was
      what built it.

      Hence this. Everything the cover needs is in this one file: the styles
      below and the logo as a data URI, so there is no request, no
      service-worker lookup and nothing to decode from a second file. The
      first frame that carries this document carries the cover.

      What this does NOT claim is zero. The handover from the phone's launch
      image to this document's first paint is not observable from inside the
      page, so it cannot be measured from here. What it does claim is that
      nothing on this side of that handover is waiting on a file. The app's
      stylesheet used to be one: vite emitted it separately and linked it from
      the head, and a linked stylesheet stops the browser painting ANYTHING,
      including markup it has already parsed, until that file is back. It is
      folded into the built document now (vite.config.ts), so the served page
      holds every byte it needs to put this cover up and fetches nothing at all
      before it does. The bundle below is a module, and a module script is
      deferred, so it cannot hold the paint either.
    -->
    <style>
      /* The panel the phone's launch image hands over to: the same solid
         white that image is painted on (SPLASH_BG in src/splash.ts), over
         everything the app draws (the app's own top layer is 30). The fade is
         stated here and triggered from there, by setting opacity to 0. */
      #splashcover {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #ffffff;
        opacity: 1;
        transition: opacity 260ms ease;
      }

      /* The logo, on the rect splashLayout() centers it at, restated in the
         only unit a stylesheet can say it in. That function sizes the logo's
         bounding square at SPLASH_LOGO_FRACTION (0.32) of the SHORTER edge of
         the screen and centers it; vmin is the viewport's shorter edge, so
         the square is 32vmin, the width is that times the art's own 280/320
         ratio (0.28), and the corner is the middle less half of each.

         The one thing a stylesheet cannot check is that the viewport IS the
         screen, which is why splash.ts writes these four numbers back onto
         this element as inline styles once it runs. On every iPhone the app
         is opened on it writes the numbers already in force, so nothing
         moves; tests/splash.test.ts is what holds the two in step. */
      #splashlogo {
        position: absolute;
        display: block;
        left: calc(50% - 14vmin);
        top: calc(50% - 16vmin);
        width: 28vmin;
        height: 32vmin;
      }

      /* The credit line, off the same shorter edge for the same reason: type
         at SPLASH_HANDLE_FRACTION (0.035) of it, and its MIDDLE
         SPLASH_HANDLE_BOTTOM_FRACTION (0.12) of it up from the bottom. CSS
         places a box by its top, so the top is those 12vmin plus half the
         type, and the line-height is pinned to the type size so the box's
         middle is where the canvas's "middle" baseline sits. Pinned to both
         side edges with centered text, which is this side's way of saying the
         canvas's canvasW/2. The font stack is the chat's own (styles.css and
         SPLASH_FONT_FAMILY), every name in it a face the device already has,
         so the line costs the cover nothing to wait for. */
      #splashhandle {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        top: calc(100% - 13.75vmin);
        font: 3.5vmin/3.5vmin -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Segoe UI", system-ui, sans-serif;
        color: #aeaeb2;
      }

      /* A browser tab had no launch image to hand over from, so there is no
         handoff to cover and the panel would just be a white flash of its
         own. splash.ts takes the element out of the document entirely in that
         case; this is the half of the pair that acts before any code runs. It
         is written as "hide it in a tab" rather than "show it in an installed
         window" on purpose: a browser that does not know the display-mode
         query then errs towards showing the cover, which is the right way
         round for the one place it matters. */
      @media (display-mode: browser) {
        #splashcover {
          display: none;
        }
      }
    </style>
  </head>
