<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paratrooper" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Paratrooper</title>

    <!--
      THE LOADING PAGE. It lives in this document rather than in the bundle, and
      src/splash.ts adopts the element below instead of building one.

      An in-page panel over the first frames was tried once before and given up
      on (v0.1.24) with the note that on a standalone cold open the white
      happens BEFORE this document arrives, so nothing in the page could cover
      it. That was true then. It is not true now, because the app paints the
      phone's OWN launch image at runtime and installs it as
      apple-touch-startup-image (see the top of src/splash.ts), so the phone
      holds the screen up to the moment the web view is handed this page. What
      is left is the stretch from that handover to the first thing the app
      draws, and that stretch has been measured on real cold opens rather than
      reasoned about: the document finished arriving at 109ms and 318ms, while
      the module bundle only began running at 338ms and 666ms. So the app's own
      startup was never the problem; fetching and parsing the bundle was, and a
      panel could not exist any earlier because the bundle was what built it.

      WHAT THIS PAGE IS, AND WHAT IT DELIBERATELY IS NOT.

      Until now this was a hand copy of the phone's launch image: the same logo
      at the same size on the same white, with the same credit line under it, so
      that the handover would read as one continuous picture. It could never
      quite be one. Two rasterizers do not set a line of type the same way, so
      the credit line blinked on every launch; the geometry had to be recomputed
      off the screen by a script in this head, because iOS reports a short
      layout viewport on the first frame; and when the app painted late, the
      whole thing dipped towards white in plain sight. Every one of those was a
      cost of pretending to be a picture the app does not own.

      So it stopped pretending. This is now the app's own loading page, and it
      is meant to look DIFFERENT from the launch image: the Earth, alone in the
      middle of the white, turning. Its own rotation is what says the app is
      still working, so the page needs nothing else on it and now has nothing
      else on it — the ring and the travelling dot that used to carry that job
      are gone, because a planet that turns says it by itself and a second
      revolution running alongside only made the picture read as a mechanism.
      The whole thing is drawn in one ink and no other colour. The one thing it
      keeps from the old page is the white it stands on, which is the very
      white the launch image is painted on (SPLASH_BG in src/splash.ts), so the
      phone's dissolve lands on the same colour it left and the globe is simply
      the new thing that appears. Every transition now reads as something the
      app meant to do.

      Everything the page needs is in this one file: the boxes are elements, the
      coastline is written out in the markup, and the motion is CSS, so there is
      no request, no service-worker lookup and nothing to decode from a second
      file. There is no picture to FETCH at all any more, which is what let the
      head's geometry script and the logo's data URI go. A map that had to be
      fetched would be that whole arrangement given back, so it is spelled out
      here instead, and it was measured down to the smallest coastline that
      still reads: 5,411 compressed bytes, against a served document that was
      9,981 before it. Everything else is a length, and every length is a
      fraction of the viewport's SHORTER edge, which on a phone is its width and
      does not change while the safe-area insets settle.

      What this does NOT claim is zero. The handover from the phone's launch
      image to this document's first paint is not observable from inside the
      page, so it cannot be measured from here. What it does claim is that
      nothing on this side of that handover is waiting on a file. The app's
      stylesheet used to be one: vite emitted it separately and linked it from
      the head, and a linked stylesheet stops the browser painting ANYTHING,
      including markup it has already parsed, until that file is back. It is
      folded into the built document now (vite.config.ts), so the served page
      holds every byte it needs to put this page up and fetches nothing at all
      before it does. The bundle below is a module, and a module script is
      deferred, so it cannot hold the paint either.
    -->
    <style>
      /* The panel the phone's launch image hands over to: the same solid white
         that image is painted on (SPLASH_BG in src/splash.ts), over everything
         the app draws (the app's own top layer is 30). The fade is stated here
         and triggered from src/splash.ts, by setting opacity to 0. Nothing is
         behind it but the app, and the app is only revealed once it has stopped
         moving, so this fade is the last motion a launch contains. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #ffffff;
        opacity: 1;
        transition: opacity 260ms ease;
      }

      /* The scene, centred on the panel, arriving rather than being there.
         The fade in is not decoration: iOS reports a short layout viewport on
         the first frame and grows it into its real height a moment later
         (measured on real cold opens: 762 tall at first paint, 812 between 68
         and 289ms afterwards), and everything below is centred on that box, so
         the scene settles downward by half of that growth. Coming up from
         nothing over the same stretch is what makes the settle a non-event, and
         it costs the page nothing, since the panel's white is the launch
         image's white and an empty scene is still a finished picture. */
      #loading .scene {
        position: absolute;
        inset: 0;
        animation: ld-appear 620ms ease-out 80ms both;
      }

      /* The one thing the scene is built round is centred on the panel and
         offset from there by half its own size, so one length says both where
         it is and how big it is. Every length is vmin, the viewport's shorter
         edge, which on a phone is the width: the one dimension that does not
         move while the safe-area insets settle.

         There is nothing behind anything else and nothing beside anything
         else, so there is no depth to state and no z-index anywhere below.
         Everything is drawn in one ink, which is the colour the app's own
         stylesheet gives its text (--text in src/styles.css). It is written
         out here rather than read from that custom property, because the panel
         under it is always the launch image's white while --text turns white
         in dark mode, and the scene would then be white on white. */
      /* Centred across on the panel, which never moves, and DOWN on the screen
         rather than on the panel, which does. iOS reports a short layout
         viewport on the first frame of a cold open and grows it into the real
         one a moment later: measured on device, 762 tall at first paint and 812
         between 68 and 289ms afterwards. Half of each is 381 and 406, so a
         scene centred on the panel paints 25px high and then drops into place,
         which is the jump he reported. lvh is the large viewport, a fixed
         property of the document that the settle does not touch, so the scene
         lands where it belongs on the first frame and has nothing to correct.
         The percentage stays underneath as the fallback for an engine that does
         not know the unit, where the old settle is still better than no rule. */
      #loading .globe {
        position: absolute;
        left: 50%;
        top: 50%;
        top: 50lvh;
        box-sizing: border-box;
      }

      /* The globe, which is now the whole scene: a hollow circle with the
         Earth's own coastlines turning inside it.

         What stood here was a wire globe — an equator, a latitude either side
         of it, one line of longitude seen as an ellipse and the axis seen edge
         on — held still inside a ring with a dot going round it, and the dot
         was the only thing that said the app was still working. The map says
         it instead, by being the thing the wire drawing was standing in for
         and by turning. That is why the ring and the dot are gone rather than
         kept alongside: two revolutions at once, at the same pace, read as a
         mechanism rather than as a planet, and the one that carries meaning is
         the one made of coastlines.

         Still hollow and still one ink. The circle is the limb, and the land
         inside it is an outline rather than a filled silhouette. Filled was
         rendered at the size this ships at rather than argued about, and it is
         perfectly legible — it simply carries about twice the ink, which turns
         the one thing on the page into a solid black shape on a page that is
         otherwise all hairlines, and at 55px across it takes the Arctic
         islands and the Antarctic coast down to featureless slabs. Outlined,
         it holds roughly the weight of black the wire drawing held, which is
         what the rest of the picture was built around.

         The circle is also what crops the map, so the box hides what leaves
         it. The border is already a full round, so cropping to it costs
         nothing and there is no second shape to keep in step with it. */
      #loading .globe {
        width: 14vmin;
        height: 14vmin;
        margin: -7vmin 0 0 -7vmin;
        border: 0.4vmin solid #000000;
        border-radius: 50%;
        overflow: hidden;
      }

      /* The strip the circle looks at. It carries the world twice over and is
         four times the circle wide, so the circle shows a quarter of it, which
         is half a world: as much of a sphere as can ever face you at once.
         Sliding it by half its own width puts the second copy exactly where
         the first stood, so the loop closes on itself and there is no seam to
         hide. The two copies are one path referenced twice rather than two
         paths, which costs 67 bytes instead of 19,639 and is why the whole map
         fits in the budget below.

         It travels the way the planet does, west to east, so the land drifts
         across the face and off the right-hand limb.

         One turn every 5200ms, and it never stops. This is the one thing on
         screen that says the app is still working, and a loading indicator
         holding perfectly still is one saying the app has died: the first
         report of it from a phone that froze it was that the animation was
         broken. The phone does not stop this by itself, and the app's other
         spinners have never stopped either, so a freeze here could only ever
         come from a rule written for it. The guidance says the same, counting
         motion in a preload phase as essential where a still indicator could
         have someone believe the content is frozen or broken, and the answer
         taken elsewhere is to halve the pace rather than take it away.

         This pace IS that half, and it is now the pace everybody gets. The
         turn used to run twice as fast and drop to this only when reduced
         motion was asked for; the slower turn read better either way, so the
         number stayed and the second rule went. There is one duration in the
         page, stated here, and nothing further down restates it.

         A translate, and nothing but a translate, for the reason the dot it
         replaced was a rotate: during a boot the main thread is the busiest it
         ever is, so nothing may run per frame in script, and a transform is
         the one thing every engine hands to the compositor. There is no
         script, no timer and no measurement anywhere in this scene. */
      #loading .earth {
        position: absolute;
        left: 0;
        top: 0;
        width: 400%;
        height: 100%;
        animation: ld-spin 5200ms linear infinite;
        will-change: transform;
      }

      /* The coastline, stroked at the weight the old wire globe drew its
         straight lines at. That number was arrived at by rendering the page at
         the size it ships at and looking: at 0.3vmin the Arctic islands close
         into one slab and the isthmus thickens into a bar, and at 0.2vmin the
         whole of the Americas still reads.

         The width is held on the SCREEN rather than in the map's own
         coordinates, and that is the only reason it is visible at all. The
         strip is four circles wide and the map is 1600 units across, so one
         unit is about an eighth of a pixel, and a width stated in those units
         lands well under one pixel however large the number looks. The effect
         that pins it to the screen is set on the shape itself rather than
         here, because it is not an inherited property and a rule written
         against the shape does not reach the copies drawn from it. That was
         measured rather than assumed: the same 0.2vmin renders 4,752 pixels
         of ink with it on the shape and 2,397 with it in a rule here, and
         2,397 is very nearly the circle's own border on its own. */
      #loading .coast {
        display: block;
        width: 100%;
        height: 100%;
        fill: none;
        stroke: #000000;
        stroke-width: 0.2vmin;
      }

      @keyframes ld-appear {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* One revolution, at a pace meant to read as calm rather than as urgent.
         Linear, because a planet that eases looks like a planet that keeps
         starting over, and because this is the one motion on the page that has
         to survive being looked at for two full seconds.

         The distance is half the strip, which is one whole world, and that is
         the only value that closes the loop: the strip holds two copies of the
         map side by side, so after sliding by exactly one of them the picture
         is identical to the one it started from and the repeat cannot be seen.
         tests/loading.test.ts recomputes that from the strip's own width, so
         the two cannot drift apart and leave a seam that walks across the
         globe once every revolution. */
      @keyframes ld-spin {
        from {
          transform: translateX(-50%);
        }
        to {
          transform: translateX(0);
        }
      }

      /* A browser tab had no launch image to hand over from, so there is no
         handover to hold and the panel would just be a flash of its own.
         splash.ts takes the element out of the document entirely in that case;
         this is the half of the pair that acts before any code runs. It is
         written as "hide it in a tab" rather than "show it in an installed
         window" on purpose: a browser that does not know the display-mode query
         then errs towards showing the page, which is the right way round for
         the one place it matters. */
      @media (display-mode: browser) {
        #loading {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- First in the body so the parser reaches it first. Nothing in here is a
         picture and nothing in here is text, and nothing in here is fetched:
         the circle and the strip are empty boxes, the coastline is a shape
         written out in full below, and the frame that carries this markup
         carries the finished page.

         The coastline is rough on purpose, and rough was chosen off measured
         bytes rather than by eye. The same outline was built at three
         published resolutions and three coordinate precisions first, and this
         is the cheapest of the nine: at the coarsest published detail, with
         every coordinate rounded to a whole unit, it is 19,457 bytes of shape
         and 5,411 once the document is compressed. The next detail level up
         costs 11,905 and the finest 16,951, and neither buys anything this
         circle is able to show — rounded to whole units the finest one keeps
         only a thirteenth of the points it started with, and most of what
         survives is specks. Rounding is what pays for all of it: the same
         outline at full precision costs 52,823, ten times this one, for
         nothing, because at this size one unit of the grid is about an eighth
         of a pixel.

         What it costs is not nothing, and the number worth carrying is the
         SERVED one, since this document ships with the app's stylesheet folded
         into it: it was 9,981 compressed bytes before the map and is a little
         over 16,500 with it. A first round trip carries somewhere around
         14,600, so under gzip this is the change that buys a second one, on
         the order of 150ms. Compressed the other way the same document is a
         little over 14,100 and still inside a single trip. That is the whole
         argument for keeping the map as coarse as it is.

         The map is written once and used twice. A second copy of the shape
         would cost another 19,457 bytes to place the same picture beside
         itself; referring to the first one costs 67. -->
    <div id="loading">
      <div class="scene">
        <div class="globe">
          <div class="earth">
            <svg class="coast" viewBox="0 0 1600 400">
