<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paratrooper" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Paratrooper</title>

    <!--
      THE LOADING PAGE. It lives in this document rather than in the bundle, and
      src/splash.ts adopts the element below instead of building one.

      An in-page panel over the first frames was tried once before and given up
      on (v0.1.24) with the note that on a standalone cold open the white
      happens BEFORE this document arrives, so nothing in the page could cover
      it. That was true then. It is not true now, because the app paints the
      phone's OWN launch image at runtime and installs it as
      apple-touch-startup-image (see the top of src/splash.ts), so the phone
      holds the screen up to the moment the web view is handed this page. What
      is left is the stretch from that handover to the first thing the app
      draws, and that stretch has been measured on real cold opens rather than
      reasoned about: the document finished arriving at 109ms and 318ms, while
      the module bundle only began running at 338ms and 666ms. So the app's own
      startup was never the problem; fetching and parsing the bundle was, and a
      panel could not exist any earlier because the bundle was what built it.

      WHAT THIS PAGE IS, AND WHAT IT DELIBERATELY IS NOT.

      Until now this was a hand copy of the phone's launch image: the same logo
      at the same size on the same white, with the same credit line under it, so
      that the handover would read as one continuous picture. It could never
      quite be one. Two rasterizers do not set a line of type the same way, so
      the credit line blinked on every launch; the geometry had to be recomputed
      off the screen by a script in this head, because iOS reports a short
      layout viewport on the first frame; and when the app painted late, the
      whole thing dipped towards white in plain sight. Every one of those was a
      cost of pretending to be a picture the app does not own.

      So it stopped pretending. This is now the app's own loading page, and it
      is meant to look DIFFERENT from the launch image: a globe seen flat from
      straight above, with one small dot going round it on a thin ring, and
      that revolution is what says the app is still working. The whole picture
      is drawn in one ink and no other colour. The one thing it keeps from the
      old page is the white it stands on, which is the very white the launch
      image is painted on (SPLASH_BG in src/splash.ts), so the phone's dissolve
      lands on the same colour it left and the globe is simply the new thing
      that appears. Every transition now reads as something the app meant to
      do.

      Everything the page needs is in this one file: the shapes are elements and
      the motion is CSS, so there is no request, no service-worker lookup and
      nothing to decode from a second file. There is no picture to fetch at all
      any more, which is what let the head's geometry script and the logo's data
      URI go: the scene is drawn from lengths, and every length is a fraction of
      the viewport's SHORTER edge, which on a phone is its width and does not
      change while the safe-area insets settle.

      What this does NOT claim is zero. The handover from the phone's launch
      image to this document's first paint is not observable from inside the
      page, so it cannot be measured from here. What it does claim is that
      nothing on this side of that handover is waiting on a file. The app's
      stylesheet used to be one: vite emitted it separately and linked it from
      the head, and a linked stylesheet stops the browser painting ANYTHING,
      including markup it has already parsed, until that file is back. It is
      folded into the built document now (vite.config.ts), so the served page
      holds every byte it needs to put this page up and fetches nothing at all
      before it does. The bundle below is a module, and a module script is
      deferred, so it cannot hold the paint either.
    -->
    <style>
      /* The panel the phone's launch image hands over to: the same solid white
         that image is painted on (SPLASH_BG in src/splash.ts), over everything
         the app draws (the app's own top layer is 30). The fade is stated here
         and triggered from src/splash.ts, by setting opacity to 0. Nothing is
         behind it but the app, and the app is only revealed once it has stopped
         moving, so this fade is the last motion a launch contains. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #ffffff;
        opacity: 1;
        transition: opacity 260ms ease;
      }

      /* The scene, centred on the panel, arriving rather than being there.
         The fade in is not decoration: iOS reports a short layout viewport on
         the first frame and grows it into its real height a moment later
         (measured on real cold opens: 762 tall at first paint, 812 between 68
         and 289ms afterwards), and everything below is centred on that box, so
         the scene settles downward by half of that growth. Coming up from
         nothing over the same stretch is what makes the settle a non-event, and
         it costs the page nothing, since the panel's white is the launch
         image's white and an empty scene is still a finished picture. */
      #loading .scene {
        position: absolute;
        inset: 0;
        animation: ld-appear 620ms ease-out 80ms both;
      }

      /* The three things the scene is built round are centred on the panel and
         offset from there by half their own size, so one length says where a
         thing is and how big it is. All of them are vmin, the viewport's
         shorter edge, which on a phone is the width: the one dimension that
         does not move while the safe-area insets settle.

         The scene is flat, seen from straight above. Nothing in it passes
         behind anything else, so there is no depth to state and no z-index
         anywhere below: the globe sits inside the ring, the dot rides the ring,
         and the dot never reaches the globe. Everything is drawn in one ink,
         which is the colour the app's own stylesheet gives its text (--text in
         src/styles.css). It is written out here rather than read from that
         custom property, because the panel under it is always the launch
         image's white while --text turns white in dark mode, and the scene
         would then be white on white. */
      /* Centred across on the panel, which never moves, and DOWN on the screen
         rather than on the panel, which does. iOS reports a short layout
         viewport on the first frame of a cold open and grows it into the real
         one a moment later: measured on device, 762 tall at first paint and 812
         between 68 and 289ms afterwards. Half of each is 381 and 406, so a
         scene centred on the panel paints 25px high and then drops into place,
         which is the jump he reported. lvh is the large viewport, a fixed
         property of the document that the settle does not touch, so the scene
         lands where it belongs on the first frame and has nothing to correct.
         The percentage stays underneath as the fallback for an engine that does
         not know the unit, where the old settle is still better than no rule. */
      #loading .globe,
      #loading .ring,
      #loading .orbit {
        position: absolute;
        left: 50%;
        top: 50%;
        top: 50lvh;
        box-sizing: border-box;
      }

      /* The globe: a wire globe rather than a circle with two lines in it. A
         hollow circle carrying an equator, a line of latitude either side of
         it, one line of longitude seen as an ellipse, and the axis line seen
         edge on. That is the drawing everyone already reads as a globe, and it
         needs every one of those five to do it. Hollow on purpose: a filled
         disc would swallow all of them.

         Smaller than it was, at his word, so the ring around it has room and
         the globe stops being the whole picture. Everything inside is stated
         in percentages of the globe's own inner box, so the drawing holds
         together at whatever size the circle is set to and one number moves
         all of it. */
      #loading .globe {
        width: 14vmin;
        height: 14vmin;
        margin: -7vmin 0 0 -7vmin;
        border: 0.4vmin solid #000000;
        border-radius: 50%;
      }

      /* The straight lines are drawn THINNER than the curves on purpose, and
         the reason was found on a rendered page rather than reasoned about: a
         straight horizontal line lands square on the screen's own rows and
         every one of them comes out solid, while a curve of the same width is
         spread across those rows and most of it is only partly covered, so it
         reads lighter. Drawn at the same number the straight lines came out as
         bars across a set of hairlines. */
      #loading .line {
        position: absolute;
        background: #000000;
      }
      #loading .equator,
      #loading .lat {
        height: 0.2vmin;
        margin-top: -0.1vmin;
      }
      /* the equator is the full diameter; the two latitudes are chords, so each
         is the width the circle actually has at its own height (a quarter of
         the radius up or down leaves it just under nine tenths as wide) */
      #loading .equator { left: 0; right: 0; top: 50%; }
      #loading .lat-n { left: 6.7%; right: 6.7%; top: 25%; }
      #loading .lat-s { left: 6.7%; right: 6.7%; top: 75%; }

      /* the one line of longitude that is not edge on, which is what gives the
         drawing its roundness, and the axis, which is the same line seen flat */
      #loading .meridian {
        position: absolute;
        left: 25%;
        right: 25%;
        top: 0;
        bottom: 0;
        box-sizing: border-box;
        border: 0.4vmin solid #000000;
        border-radius: 50%;
      }
      #loading .axis {
        left: 50%;
        top: 0;
        bottom: 0;
        width: 0.2vmin;
        margin-left: -0.1vmin;
        background: #000000;
      }

      /* The ring: one true circle, drawn once. Seen from above there is no near
         arc and no far arc, so there is nothing to cut and nothing to draw a
         second copy of. It is thinner than the globe's own stroke, so the globe
         stays the subject and the ring reads as the line the dot travels rather
         than as a second drawing. */
      #loading .ring {
        width: 40vmin;
        height: 40vmin;
        margin: -20vmin 0 0 -20vmin;
        border: 0.25vmin solid #000000;
        border-radius: 50%;
      }

      /* The arm the dot rides, which is an empty box that turns. Its top edge
         is the line the ring draws: the ring is a border-box with its stroke
         painted inside it, so that line is half a stroke in on every side, and
         this box is the ring's box less one whole stroke.

         Turning a box is what a true circle buys. The dot has to travel without
         the main thread, which during a boot is the busiest it ever is, so
         nothing may run per frame in script. A rotate is a transform and every
         engine hands it to the compositor, and because the path is a circle
         there is no path to write out as points and no squashing anywhere: the
         dot is rasterized at its own size and only turned. It is a circle, so
         its own turning cannot be seen. */
      #loading .orbit {
        width: 39.75vmin;
        height: 39.75vmin;
        margin: -19.875vmin 0 0 -19.875vmin;
        animation: ld-orbit 2600ms linear infinite;
        will-change: transform;
      }

      /* The travelling dot, centred on the arm's top edge, so it sits on the
         ring's line rather than beside it. Filled, and fatter than the line it
         rides, which is what makes it the thing that is moving. */
      #loading .dot {
        position: absolute;
        left: 50%;
        top: 0;
        width: 2.4vmin;
        height: 2.4vmin;
        margin: -1.2vmin 0 0 -1.2vmin;
        border-radius: 50%;
        background: #000000;
      }

      @keyframes ld-appear {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* One revolution, at a pace meant to read as calm rather than as urgent.
         Linear, because a turn that eases looks like a turn that keeps starting
         over. tests/loading.test.ts checks the arm against the ring's own
         declarations, so the dot cannot drift off the line it is riding. */
      @keyframes ld-orbit {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Asked for reduced motion: the revolution SLOWS. It does not stop.

         It used to stop, and that was the wrong call. This is the one thing on
         screen that says the app is still working, and a loading indicator
         holding perfectly still is a loading indicator saying the app has died:
         the first report of it from a phone with the setting on was that the
         animation was broken. The phone does not stop this by itself, and the
         app's other spinners have never stopped under the same setting, so the
         only thing that ever froze it was this rule.

         The guidance says the same. Motion in a preload phase counts as
         essential where a still indicator could have someone believe the
         content is frozen or broken, and the technique that asks for the
         setting to be honoured covers motion a person starts by doing
         something, which nobody starts by opening the app. The usual answer
         elsewhere is to halve the pace rather than take it away, and one
         well-known component set shipped the freeze, was told a frozen bar
         looks broken, and went back to slowing it.

         So this is the same turn at half speed. Stating only the duration
         leaves the name, the easing and the endless count exactly as they are
         above, so there is one revolution described in one place.

         The panel still fades in and still fades out, because a change of
         opacity is not movement and the alternative is the page appearing and
         vanishing as cuts. */
      @media (prefers-reduced-motion: reduce) {
        #loading .orbit {
          animation-duration: 5200ms;
        }
      }

      /* A browser tab had no launch image to hand over from, so there is no
         handover to hold and the panel would just be a flash of its own.
         splash.ts takes the element out of the document entirely in that case;
         this is the half of the pair that acts before any code runs. It is
         written as "hide it in a tab" rather than "show it in an installed
         window" on purpose: a browser that does not know the display-mode query
         then errs towards showing the page, which is the right way round for
         the one place it matters. */
      @media (display-mode: browser) {
        #loading {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- First in the body so the parser reaches it first. Nothing in here is a
         picture and nothing in here is text: the whole scene is six empty boxes
         and the rules above, so the frame that carries this markup carries the
         finished page. The scene is flat, so this is not a depth order, just
         the order it reads in: the ring the dot travels, the dot on its turning
         arm, and the globe in the middle with its five lines. -->
    <div id="loading">
      <div class="scene">
        <div class="ring"></div>
        <div class="orbit"><div class="dot"></div></div>
        <div class="globe">
          <div class="line equator"></div>
          <div class="line lat lat-n"></div>
          <div class="line lat lat-s"></div>
          <div class="meridian"></div>
          <div class="line axis"></div>
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
