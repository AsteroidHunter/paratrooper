<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Paratrooper" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Paratrooper</title>

    <!--
      THE LOADING PAGE. It lives in this document rather than in the bundle, and
      src/splash.ts adopts the element below instead of building one.

      An in-page panel over the first frames was tried once before and given up
      on (v0.1.24) with the note that on a standalone cold open the white
      happens BEFORE this document arrives, so nothing in the page could cover
      it. That was true then. It is not true now, because the app paints the
      phone's OWN launch image at runtime and installs it as
      apple-touch-startup-image (see the top of src/splash.ts), so the phone
      holds the screen up to the moment the web view is handed this page. What
      is left is the stretch from that handover to the first thing the app
      draws, and that stretch has been measured on real cold opens rather than
      reasoned about: the document finished arriving at 109ms and 318ms, while
      the module bundle only began running at 338ms and 666ms. So the app's own
      startup was never the problem; fetching and parsing the bundle was, and a
      panel could not exist any earlier because the bundle was what built it.

      WHAT THIS PAGE IS, AND WHAT IT DELIBERATELY IS NOT.

      Until now this was a hand copy of the phone's launch image: the same logo
      at the same size on the same white, with the same credit line under it, so
      that the handover would read as one continuous picture. It could never
      quite be one. Two rasterizers do not set a line of type the same way, so
      the credit line blinked on every launch; the geometry had to be recomputed
      off the screen by a script in this head, because iOS reports a short
      layout viewport on the first frame; and when the app painted late, the
      whole thing dipped towards white in plain sight. Every one of those was a
      cost of pretending to be a picture the app does not own.

      So it stopped pretending. This is now the app's own loading page, and it
      is meant to look DIFFERENT from the launch image: a planet with a ring,
      and a moon going round the ring, and that orbit is what says the app is
      still working. The one thing it keeps from the old page is the white it
      stands on, which is the very white the launch image is painted on
      (SPLASH_BG in src/splash.ts), so the phone's dissolve lands on the same
      colour it left and the planet is simply the new thing that appears. Every
      transition now reads as something the app meant to do.

      Everything the page needs is in this one file: the shapes are elements and
      the motion is CSS, so there is no request, no service-worker lookup and
      nothing to decode from a second file. There is no picture to fetch at all
      any more, which is what let the head's geometry script and the logo's data
      URI go: the scene is drawn from lengths, and every length is a fraction of
      the viewport's SHORTER edge, which on a phone is its width and does not
      change while the safe-area insets settle.

      What this does NOT claim is zero. The handover from the phone's launch
      image to this document's first paint is not observable from inside the
      page, so it cannot be measured from here. What it does claim is that
      nothing on this side of that handover is waiting on a file. The app's
      stylesheet used to be one: vite emitted it separately and linked it from
      the head, and a linked stylesheet stops the browser painting ANYTHING,
      including markup it has already parsed, until that file is back. It is
      folded into the built document now (vite.config.ts), so the served page
      holds every byte it needs to put this page up and fetches nothing at all
      before it does. The bundle below is a module, and a module script is
      deferred, so it cannot hold the paint either.
    -->
    <style>
      /* The panel the phone's launch image hands over to: the same solid white
         that image is painted on (SPLASH_BG in src/splash.ts), over everything
         the app draws (the app's own top layer is 30). The fade is stated here
         and triggered from src/splash.ts, by setting opacity to 0. Nothing is
         behind it but the app, and the app is only revealed once it has stopped
         moving, so this fade is the last motion a launch contains. */
      #loading {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: #ffffff;
        opacity: 1;
        transition: opacity 260ms ease;
      }

      /* The scene, centred on the panel, arriving rather than being there.
         The fade in is not decoration: iOS reports a short layout viewport on
         the first frame and grows it into its real height a moment later
         (measured on real cold opens: 762 tall at first paint, 812 between 68
         and 289ms afterwards), and everything below is centred on that box, so
         the scene settles downward by half of that growth. Coming up from
         nothing over the same stretch is what makes the settle a non-event, and
         it costs the page nothing, since the panel's white is the launch
         image's white and an empty scene is still a finished picture. */
      #loading .scene {
        position: absolute;
        inset: 0;
        animation: ld-appear 620ms ease-out 80ms both;
      }

      /* Every part of the scene is centred on the panel and offset from there
         by half its own size, so one length says where a thing is and how big
         it is. All of them are vmin, the viewport's shorter edge, which on a
         phone is the width: the one dimension that does not move while the
         safe-area insets settle. */
      #loading .planet,
      #loading .ring,
      #loading .moon {
        position: absolute;
        left: 50%;
        top: 50%;
        box-sizing: border-box;
      }

      /* The planet: one soft disc, lit from up and to the left, in the greys
         the chat already uses for its received bubbles and its hairlines. No
         outline, no texture, nothing to read as an icon. */
      #loading .planet {
        z-index: 3;
        width: 22vmin;
        height: 22vmin;
        margin: -11vmin 0 0 -11vmin;
        border-radius: 50%;
        background: radial-gradient(circle at 36% 30%, #f4f4f6 0%, #e4e4e8 46%, #cfcfd4 100%);
        box-shadow: 0 0.6vmin 1.8vmin rgba(0, 0, 0, 0.05);
      }

      /* The ring: one thin ellipse, tilted, drawn TWICE. Both copies are the
         whole ellipse and both sit at the same place; what differs is which
         side of the planet they are painted on and, for the front copy, that it
         is cut down to its near half.

         That is the whole trick of a ringed planet. The back copy paints first,
         so the planet covers the part of it that passes behind. The front copy
         paints last, so the part of it that passes in front crosses the disc.
         Where the two would show the same arc, outside the disc, they are the
         same pixels, so the seam the cut leaves has the back copy underneath it
         and cannot open a gap.

         The cut is stated in the ring's OWN frame, before the tilt: clip-path
         applies to the element and the transform applies to the result, so
         "the lower half" is the lower half of the untilted ellipse, which is
         exactly the half that the tilt brings towards the viewer. */
      #loading .ring {
        z-index: 1;
        width: 42vmin;
        height: 13.6vmin;
        margin: -6.8vmin 0 0 -21vmin;
        border: 0.3vmin solid #c7c7cc;
        border-radius: 50%;
        transform: rotate(-18deg);
      }

      #loading .front {
        z-index: 4;
        clip-path: inset(50% 0 0 0);
      }

      /* The moon, also drawn twice, for the same reason and by the same rule:
         one copy under the planet and one over it, each shown only while the
         orbit has it on that copy's side. The two are the same dot on the same
         path at the same instant, so the handover between them happens with
         both of them on the same pixel and nothing to see.

         The swap is a step, not a fade: two dots cross-fading through each
         other would read as one dot dimming, which is the one thing an orbit
         must not do. The half of the path each copy owns is settled by
         ld-orbit's own parametrisation, which starts at one end of the ring's
         long axis and passes the far side first.

         The transform stated here is where the dot sits when the orbit is NOT
         running, which is the reduced-motion case at the bottom of this block:
         it is ld-orbit's own 75% stop, the near arc's lowest point, so the
         still scene is a moon resting in front of the planet.

         The two copies are named by class alone rather than by class on top of
         class, so all three rules weigh the same and the last one written wins.
         That is what lets one line at the bottom of this block turn the orbit
         off for both of them. */
      #loading .moon {
        z-index: 2;
        width: 3.2vmin;
        height: 3.2vmin;
        margin: -1.6vmin 0 0 -1.6vmin;
        border-radius: 50%;
        background: #8e8e93;
        opacity: 0;
        transform: translate(2.055vmin, 6.325vmin);
        will-change: transform;
      }

      #loading .far {
        animation:
          ld-orbit 2600ms linear infinite,
          ld-far 2600ms step-end infinite;
      }

      #loading .near {
        z-index: 5;
        opacity: 1;
        animation:
          ld-orbit 2600ms linear infinite,
          ld-near 2600ms step-end infinite;
      }

      @keyframes ld-appear {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* Which copy of the moon is showing. The far one owns the first half of
         the orbit and the near one the second, and step-end holds each value
         until the next stop rather than sliding towards it. */
      @keyframes ld-far {
        0% {
          opacity: 1;
        }
        50% {
          opacity: 0;
        }
      }

      @keyframes ld-near {
        0% {
          opacity: 0;
        }
        50% {
          opacity: 1;
        }
      }

      /*
        THE ORBIT: the ring's own ellipse, sampled.

        The dot has to travel the line the ring is drawn on, and it has to do it
        without the main thread, which during a boot is the busiest it ever is.
        That rules out anything that runs per frame in script, and it rules out
        squashing a circular spin into an ellipse, because a dot squashed by one
        transform and stretched back by another is rasterized at the squashed
        size and comes out soft. What is left is the plainest thing there is: a
        translate, which every engine hands to the compositor.

        So the ellipse is written out as points. Each stop is

          x = RX * cos(t) * cos(TILT) - RY * sin(t) * sin(TILT)
          y = RX * cos(t) * sin(TILT) + RY * sin(t) * cos(TILT)
          t = 180deg + 360deg * (the stop's own fraction)

        with TILT the ring's own -18deg, and RX and RY the ring's CENTRE line
        rather than its outer edge: the ring is a 42 by 13.6 box with a 0.3
        border drawn inside it, so the line itself is 20.85 by 6.65 and that is
        what the dot rides. Thirty six stops leave the straight run between two
        of them under a tenth of a vmin inside the true curve, which is well
        under one device pixel on any phone.

        Starting at t = 180deg puts the first stop on one end of the long axis,
        which is where the far side of the ring meets the near side. So the
        first half of the animation is the arc that passes behind the planet and
        the second half is the arc that passes in front, which is what the two
        opacity tracks above are cut against.

        tests/loading.test.ts recomputes every stop from the ring's own
        declarations and compares, so the numbers cannot drift away from the
        shape they are supposed to be riding.
      */
      @keyframes ld-orbit {
        0% { transform: translate(-19.83vmin, 6.443vmin); }
        2.78% { transform: translate(-19.885vmin, 5.247vmin); }
        5.56% { transform: translate(-19.337vmin, 3.891vmin); }
        8.33% { transform: translate(-18.2vmin, 2.418vmin); }
        11.11% { transform: translate(-16.511vmin, 0.87vmin); }
        13.89% { transform: translate(-14.32vmin, -0.703vmin); }
        16.67% { transform: translate(-11.694vmin, -2.256vmin); }
        19.44% { transform: translate(-8.713vmin, -3.739vmin); }
        22.22% { transform: translate(-5.467vmin, -5.11vmin); }
        25% { transform: translate(-2.055vmin, -6.325vmin); }
        27.78% { transform: translate(1.42vmin, -7.347vmin); }
        30.56% { transform: translate(4.851vmin, -8.147vmin); }
        33.33% { transform: translate(8.135vmin, -8.699vmin); }
        36.11% { transform: translate(11.172vmin, -8.986vmin); }
        38.89% { transform: translate(13.869vmin, -9.001vmin); }
        41.67% { transform: translate(16.145vmin, -8.742vmin); }
        44.44% { transform: translate(17.931vmin, -8.218vmin); }
        47.22% { transform: translate(19.171vmin, -7.443vmin); }
        50% { transform: translate(19.83vmin, -6.443vmin); }
        52.78% { transform: translate(19.885vmin, -5.247vmin); }
        55.56% { transform: translate(19.337vmin, -3.891vmin); }
        58.33% { transform: translate(18.2vmin, -2.418vmin); }
        61.11% { transform: translate(16.511vmin, -0.87vmin); }
        63.89% { transform: translate(14.32vmin, 0.703vmin); }
        66.67% { transform: translate(11.694vmin, 2.256vmin); }
        69.44% { transform: translate(8.713vmin, 3.739vmin); }
        72.22% { transform: translate(5.467vmin, 5.11vmin); }
        75% { transform: translate(2.055vmin, 6.325vmin); }
        77.78% { transform: translate(-1.42vmin, 7.347vmin); }
        80.56% { transform: translate(-4.851vmin, 8.147vmin); }
        83.33% { transform: translate(-8.135vmin, 8.699vmin); }
        86.11% { transform: translate(-11.172vmin, 8.986vmin); }
        88.89% { transform: translate(-13.869vmin, 9.001vmin); }
        91.67% { transform: translate(-16.145vmin, 8.742vmin); }
        94.44% { transform: translate(-17.931vmin, 8.218vmin); }
        97.22% { transform: translate(-19.171vmin, 7.443vmin); }
        100% { transform: translate(-19.83vmin, 6.443vmin); }
      }

      /* Asked for no motion: the scene stands still. The orbit stops, the far
         copy of the moon stays hidden and the near one sits at the resting
         point its own rule states, so what is left is a finished picture of a
         ringed planet with its moon in front. The panel still fades in and
         still fades out, because a change of opacity is not movement and the
         alternative is the page appearing and vanishing as cuts. */
      @media (prefers-reduced-motion: reduce) {
        #loading .moon {
          animation: none;
        }
      }

      /* A browser tab had no launch image to hand over from, so there is no
         handover to hold and the panel would just be a flash of its own.
         splash.ts takes the element out of the document entirely in that case;
         this is the half of the pair that acts before any code runs. It is
         written as "hide it in a tab" rather than "show it in an installed
         window" on purpose: a browser that does not know the display-mode query
         then errs towards showing the page, which is the right way round for
         the one place it matters. */
      @media (display-mode: browser) {
        #loading {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!-- First in the body so the parser reaches it first. Nothing in here is a
         picture and nothing in here is text: the whole scene is five empty
         boxes and the rules above, so the frame that carries this markup
         carries the finished page. The parts are in painting order, which is
         also depth order: the ring's far side, the moon while it is out there,
         the planet, the ring's near side, and the moon while it is in front. -->
    <div id="loading">
      <div class="scene">
        <div class="ring back"></div>
        <div class="moon far"></div>
        <div class="planet"></div>
        <div class="ring front"></div>
        <div class="moon near"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
