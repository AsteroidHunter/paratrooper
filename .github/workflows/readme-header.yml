name: readme-header

# Refresh the README header badge (tools/readme-header/*.png) whenever the app's
# version, badge markup, badge styles, logo, or the generator itself changes.
# The image is rendered from pwa/src/main.ts + pwa/src/styles.css +
# pwa/public/splash-logo.png (the full-resolution copy of the same artwork the
# app ships small as pwa/public/topbar-logo.png), so it always matches the app's
# first-open badge and carries the real APP_VERSION. Branch-relative on purpose:
# each branch keeps its own header for the version on that branch.
#
# Nothing here is live until this workflow file and the generator are actually
# pushed to GitHub. It does not create semantic version bumps and cannot force
# GitHub's README image cache to refresh instantly.

on:
  push:
    # Branches only: a tag push must never make this create a branch of the
    # same name via the push step below.
    branches:
      - '**'
    paths:
      - pwa/src/main.ts
      - pwa/src/styles.css
      - pwa/public/splash-logo.png
      - pwa/public/topbar-logo.png
      - tools/readme-header/generate.py
      - .github/workflows/readme-header.yml

# One run per branch, cancelling an older in-flight run. This is only an
# optimisation: cancellation is asynchronous, so it is NOT what keeps a stale
# render off newer source. Correctness comes from the publish step, which
# re-fetches the branch head and re-renders from it before every push attempt.
concurrency:
  group: readme-header-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    # macOS so -apple-system resolves to San Francisco, the face the app wears.
    runs-on: macos-15
    permissions:
      contents: write # only to commit the regenerated PNGs on this branch
    steps:
      - name: Check out the pushed branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install pinned Playwright + WebKit
        run: |
          python -m pip install --upgrade pip
          python -m pip install "playwright==1.61.0"
          python -m playwright install webkit

      - name: Render from the current head and publish if the badge changed
        # BRANCH is passed as data, never spliced into the shell below, so an
        # unusual (but valid) ref name cannot break out of the string.
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Bounded, non-force publish loop. Every attempt re-fetches the branch
          # tip and RE-RENDERS from that exact head, so the committed PNGs always
          # match the newest source. There is no rebase of a pre-rendered commit,
          # so a stale image can never land on top of newer source and an old
          # version badge can never be published. The reset only rewinds this
          # disposable runner checkout, never anything in a real repository.
          for attempt in 1 2 3 4 5; do
            git fetch origin "refs/heads/$BRANCH"
            git reset --hard FETCH_HEAD
            python tools/readme-header/generate.py
            if git diff --quiet -- tools/readme-header/; then
              echo "Badge already current for $(git rev-parse HEAD); nothing to commit."
              exit 0
            fi
            git add tools/readme-header/paratrooper-header-light.png \
                    tools/readme-header/paratrooper-header-dark.png
            # [skip render] so Render does not run a second app deploy for this
            # docs-only refresh (render.com/docs/deploys#skipping-an-auto-deploy).
            # No [skip ci] needed: a GITHUB_TOKEN push does not recursively
            # trigger this push workflow, and the PNGs are outside its path
            # filter. The commit is limited to the two PNGs.
            git commit -m "Refresh README header images [skip render]"
            # Plain (non-force) push. If the branch advanced meanwhile the push is
            # rejected and we loop to re-fetch and re-render from the new head.
            if git push origin "HEAD:refs/heads/$BRANCH"; then
              echo "Pushed refreshed badge onto $BRANCH."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); re-fetching and re-rendering."
          done
          echo "Could not publish badge after retries." >&2
          exit 1
