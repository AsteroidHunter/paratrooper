[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paratrooper"
version = "0.1.0"
description = "Phone chat with a configurable agent and optional pinboard tools."
requires-python = ">=3.12"
license = { file = "LICENSE.md" }
authors = [{ name = "Akash Satpathy" }]

# The ranges below are the intent: the oldest version of each package whose
# behaviour the code relies on. They are deliberately NOT the pin. What each
# image actually installs is fixed by constraints-web.txt and
# constraints-agent.txt for the existing services, plus constraints-agent-plain.txt
# for the plain worker's resolved dependency closure. Each Dockerfile applies its
# own file with `pip install -c`. A constraints file
# is the only place a transitive package can be pinned without being declared a
# direct dependency, which it is not. PINNING.md says how to bump either side.
#
# Base deps shared by every entry point. The placement engine is the only
# truly universal piece (the web service validates proposals too), so it lives
# in the base set. Service-specific deps go in the extras below so the web and
# worker images can install only what they need.
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pillow>=10.3",
]

[project.optional-dependencies]
# Worker service: Agent SDK + git/Spotify/screenshot tooling.
agent = [
    # pinned exactly: the subprocess env scrub is a feature of the CLI the SDK
    # bundles, not of the SDK, so an open range meant the image took whatever
    # was newest at build time and the switch's presence moved with the date.
    # 0.2.158 bundles Claude Code 2.1.280, the first CLI that runs Opus 5.5.
    "claude-agent-sdk==0.2.158",
    "httpx>=0.27",
    # RS256 for the GitHub App's JWT: the worker signs one with the App's
    # private key and trades it for an hourly installation token. The [crypto]
    # extra is what pulls in the RSA backend PyJWT needs to sign at all.
    "pyjwt[crypto]>=2.8",
    "playwright>=1.44",
    "redis>=5.0",
    "pydantic>=2.0",  # the worker shares the web's wire-contract models
]
# Plain worker: the same SDK, chat/photos, queue and optional Spotify lookup.
# No direct GitHub or browser dependency. The SDK's MCP dependency still requires
# PyJWT[crypto] transitively; the plain runtime does not use its GitHub auth path.
agent-plain = [
    "claude-agent-sdk==0.2.158",
    "httpx>=0.27",
    "redis>=5.0",
    "pydantic>=2.0",
    "pillow>=10.3",
]
# Web service: FastAPI socket/PWA host + queue + push.
web = [
    "fastapi>=0.110",
    "httpx>=0.27",  # /publish merge calls + Render suspend/resume

    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "websockets>=12.0",
    "redis>=5.0",
    "pywebpush>=2.0",
]
# The laptop tools: the config delivery command (`python -m paratrooper.deploy`)
# and the first-install provisioner (`python -m paratrooper.provision`). A
# laptop's dependencies, not a service's: neither image installs this extra, and
# nothing a service imports reaches for these on its account.
deploy = [
    "httpx>=0.27",  # the Render API calls
    "pyyaml>=6.0",  # reading the Render CLI's own config, and render.yaml
    # generating the browser-push (VAPID) EC P-256 key pair the provisioner sets
    # on the web service. Already in the project's closure via the agent extra's
    # pyjwt[crypto]; named here because the installer runs without the agent extra.
    "cryptography>=42.0",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/paratrooper"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
