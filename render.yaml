# Render Blueprint: web + worker + Key Value.
#
# Secrets are `sync: false` — set them in the Render dashboard at first deploy.
# The persistent disk holds the thread DB; image blobs ride the shared Key Value
# (see web/inbox.py) since a Render disk attaches to only one service. After
# deploy, branch-protect `main` to require a PR before merge.
#
# CONFIGURATION. Both services read this deployment's whole configuration —
# profile, model, notification texts, upload expiry and, on pinboard, the site's
# own settings — out of ONE environment variable, PARATROOPER_CONFIG_B64, whose
# value is the TOML source base64-encoded. It is declared `sync: false` here
# because a Blueprint may declare a key without carrying its value; the value is
# set by `python -m paratrooper.deploy push config/paratrooper.toml`, or by hand
# from `base64 < config/paratrooper.toml | tr -d '\n'`. No configuration file
# ships in either image and no path variable is read: there is one route and no
# fallback, so a service either has this value or does not start.
#
# Only two machine paths stay environment values, because they are exactly what
# differs between two containers reading one source: PARATROOPER_INBOX on both,
# and PARATROOPER_SITE_ROOT on the pinboard worker.

services:
  # --- web: socket + PWA + auth + uploads + threads + /publish ---
  - type: web
    name: paratrooper-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /api/health
    disk:
      name: paratrooper-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PARATROOPER_CONFIG_B64
        sync: false  # the whole configuration, base64-encoded; see the header
      - key: PARATROOPER_INBOX
        value: /data/inbox  # thread DB derives as /data/threads.sqlite (persistent)
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paratrooper-kv
          property: connectionString
      - key: PARATROOPER_APP_TOKEN
        sync: false
      # Optional cost saver: set both and the web service suspends the worker
      # between jobs (resume on enqueue, suspend when the queue drains).
      # RENDER_API_KEY: Account Settings -> API Keys.
      # RENDER_WORKER_SERVICE_ID: the worker's srv-... id (its dashboard URL).
      - key: RENDER_API_KEY
        sync: false
      - key: RENDER_WORKER_SERVICE_ID
        sync: false
      - key: PARATROOPER_GITHUB_TOKEN
        sync: false
      - key: PARATROOPER_MERGE_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false

  # --- worker: Agent SDK + placement + Playwright + git ---
  - type: worker
    name: paratrooper-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    plan: standard  # ~2GB RAM for Chromium
    region: oregon
    envVars:
      - key: PARATROOPER_CONFIG_B64
        sync: false  # the whole configuration, base64-encoded; see the header
      - key: PARATROOPER_SITE_ROOT
        value: /app/site_checkout  # cloned on boot from [pinboard].remote
      - key: PARATROOPER_INBOX
        value: /tmp/paratrooper-inbox  # transient: blobs materialized from Key Value
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: paratrooper-kv
          property: connectionString
      - key: AGENT_AUTH
        value: subscription  # manual mode, no fallback (Open Q#4)
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      # The worker authenticates to GitHub as the paratrooper-98cc App: it signs
      # a JWT with the App's private key and trades it for an installation token
      # that lives an hour. That replaces the personal access token that used to
      # sit here, which never expired. Three values, all set by hand: two ids and
      # the private key. The key was a secret file at
      # /etc/secrets/paratrooper-98cc-github-app.pem until 2026-09-07; that file
      # is deleted and the key is the variable below, so all three now ride the
      # same road. Paste the App's .pem in full, BEGIN and END lines included,
      # either across several lines or with the line breaks written as
      # backslash-n; the worker accepts both and checks the key parses at boot.
      # The start-up wrapper takes all three out of the worker's launch record.
      - key: PARATROOPER_GITHUB_APP_ID
        sync: false
      - key: PARATROOPER_GITHUB_APP_INSTALLATION_ID
        sync: false
      - key: PARATROOPER_GITHUB_APP_KEY_PEM
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false

  # --- Key Value: job queue + result pub/sub + interrupt + inbox blobs ---
  - type: keyvalue
    name: paratrooper-kv
    plan: starter
    region: oregon
    ipAllowList: []  # internal (private network) only
    maxmemoryPolicy: noeviction  # never silently drop a queued job
